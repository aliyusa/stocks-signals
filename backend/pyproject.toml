[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI Depends idiom. UP042: str-Enum kept for SQLAlchemy/Pydantic clarity.
ignore = ["B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
