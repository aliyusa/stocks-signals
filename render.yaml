# Render Blueprint: one free web service. The database is Supabase (set DATABASE_URL in the Render dashboard).
services:
  - type: web
    name: halal-stock-signals
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false          # paste the Supabase Session pooler URI; never commit it
      - key: EODHD_API_KEY
        sync: false          # paste your EODHD key; it stays server-side
      - key: ALLOWED_EMAILS
        sync: false          # e.g. ["you@example.com"]; only these emails can register
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: '[]'
